name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths-ignore: ["rag-ui/**", "**.md"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "MA29/customer-support-api")
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Spaces need the YAML front matter in README.md and reject large/binary history,
          # so push a fresh single-commit snapshot of the backend.
          rm -rf .git rag-ui tests pytest-cache-files-*
          cp deploy/hf-space-README.md README.md
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
